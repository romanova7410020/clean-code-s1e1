<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">
  <div class="matrix-info">
    <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
    <a class="more-info"
      href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?
    </a>
  </div>
  <main class="todo-container">
    <section id="add-section">
      <label class="label-new-task" for="new-task">Add Item</label>
      <div class="task-row">
        <input class="input-text new-task" id="new-task" type="text">
        <button class="button add-task">Add</button>
      </div>
    </section>
    <section>
      <h2 class="section-title">Todo</h2>
          <ul class="list incomplete" id="incomplete-tasks">
            <li class="list-item">
              <input class="checkbox" type="checkbox">
              <label class="label-task">Pay Bills</label>
              <input class="input-edit" type="text" class="task">
              <button class="button edit">Edit</button>
              <button class="button button-delete">
                <img src="./remove.svg" alt="delete task">
              </button>
            </li>
            <li class="list-item edit-mode">
              <input class="checkbox" type="checkbox">
              <label class="label-task">Go Shopping</label>
              <input class="input-edit" type="text" value="Go Shopping">
              <button class="button edit">Save</button>
              <button class="button button-delete">
                <img src="./remove.svg" alt="delete task">
              </button>
            </li>
          </ul>
    </section>
    <section>
          <h2 class="section-title">Completed</h2>
          <ul class="list completed" id="completed-tasks">
            <li class="list-item">
              <input class="checkbox" type="checkbox" checked>
              <label class="label-task">See the Doctor</label>
              <input class="input-edit" type="text" class="task">
              <button class="button edit">Edit</button>
              <button class="button button-delete">
                <img src="./remove.svg" alt="delete task">
              </button>
          </li>
          </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
