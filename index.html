<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">
  <div class="matrix">
    <img class="matrix__image" src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
    <a class="matrix__link"
      href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?
    </a>
  </div>
  <main class="todo">
    <section id="todo__add-section">
      <label class="todo__label-new-task" for="new-task">Add Item</label>
      <div class="todo__task-row">
        <input class="todo__input-text todo__input-text_new-task" id="new-task" type="text">
        <button class="todo__button todo__button_add-task">Add</button>
      </div>
    </section>
    <section class="todo__task_section">
      <h2 class="todo__section-title">Todo</h2>
          <ul class="todo__list todo__list_incomplete" id="incomplete-tasks">
            <li class="todo__list-item">
              <input class="todo__checkbox" type="checkbox">
              <label class="todo__label-task">Pay Bills</label>
              <input class="todo__input-edit" type="text" class="task">
              <button class="todo__button todo__button_edit">Edit</button>
              <button class="todo__button todo__button_delete">
                <img src="./remove.svg" alt="delete task">
              </button>
            </li>
            <li class="todo__list-item todo__list-item_edit-mode">
              <input class="todo__checkbox" type="checkbox">
              <label class="todo__label-task">Go Shopping</label>
              <input class="todo__input-edit" type="text" value="Go Shopping">
              <button class="todo__button todo__button_edit">Save</button>
              <button class="todo__button todo__button_delete">
                <img src="./remove.svg" alt="delete task">
              </button>
            </li>
          </ul>
    </section>
    <section class="todo__tasks-section">
          <h2 class="todo__section-title">Completed</h2>
          <ul class="todo__list todo__list_completed" id="completed-tasks">
            <li class="todo__list-item">
              <input class="todo__checkbox" type="checkbox" checked>
              <label class="todo__label-task">See the Doctor</label>
              <input class="todo__input-edit" type="text" class="task">
              <button class="todo__button todo__button_edit">Edit</button>
              <button class="todo__button todo__button_delete">
                <img src="./remove.svg" alt="delete task">
              </button>
          </li>
          </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
